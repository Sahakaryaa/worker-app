name: worker_app
description: "SahaKarya Partner (सहकार्य साथी) — Cooperative Gig Worker App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP & WebSocket / SocketIO
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  web_socket_channel: ^3.0.2

  # Maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Auth & storage
  flutter_secure_storage: ^9.2.4

  # Typography
  google_fonts: ^6.2.1

  # Internationalization & Formatting
  intl: ^0.20.2

  # UI & Charts
  fl_chart: ^0.69.2
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  device_preview: ^1.2.0
  # Animation & Motion
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.17

  # Routing
  go_router: ^15.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
